<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dice Game</title>
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/die-mod-panel.css">
</head>
<body>
  <div class="app">
    <section class="panel play">
      <div class="play-mode-toggle" role="tablist" aria-label="Play mode">
        <button id="roll-mode-btn" class="mode-button" type="button">Roll</button>
        <button id="mod-mode-btn" class="mode-button" type="button">Mod</button>
        <button id="roll-3d-mode-btn" class="mode-button" type="button">Roll 3D</button>
        <button id="horde-mode-btn" class="mode-button" type="button">Horde</button>
      </div>
      <div id="roll-screen" class="play-screen">
        <canvas id="dice-canvas" width="900" height="520"></canvas>
        <button id="roll-btn" class="roll-button" type="button">Roll</button>
      </div>
      <div id="die-mod-panel" class="die-mod-panel play-screen"></div>
      <div id="roll-3d-screen" class="play-screen is-hidden">
        <div class="roll-3d-layout">
          <div class="roll-3d-canvas-host"></div>
          <div class="roll-3d-easter-egg" aria-hidden="true">
            <canvas id="die-isometric-canvas"></canvas>
          </div>
          <div class="roll-3d-dock is-hidden">
            <div id="roll-3d-die-mod-panel" class="die-mod-panel roll-3d-die-mod-panel"></div>
          </div>
        </div>
        <button id="roll-3d-btn" class="roll-button" type="button">Roll</button>
      </div>
      <div id="horde-screen" class="play-screen is-hidden"></div>
    </section>

    <aside class="panel management">
      <div id="counter-grid" class="counter-grid"></div>
      <ul id="trick-list" class="trick-list"></ul>
      <label class="management-toggle">
        <input id="roll-3d-easter-egg-toggle" type="checkbox">
        Use Isometric Dice View (Easter Egg)
      </label>
      <section class="render-preset-panel" aria-label="Render presets">
        <h3 class="render-preset-title">Render Presets</h3>
        <p class="render-preset-caption">Quick diagnostics for brightness and contrast while tuning materials.</p>
        <div id="render-preset-buttons" class="render-preset-grid" role="group" aria-label="Render preset options">
          <button class="render-preset-button" type="button" data-render-preset="balanced">ACES Balanced</button>
          <button class="render-preset-button" type="button" data-render-preset="too-bright">Reinhard Bright</button>
          <button class="render-preset-button is-active" type="button" data-render-preset="too-dark">ACES Dark</button>
          <button class="render-preset-button" type="button" data-render-preset="flat-diagnostic">No Tone Flat</button>
        </div>
      </section>
      <p>Placeholder for TB-03 bag management.</p>
      <section class="roll-history-panel" aria-label="Roll history">
        <h3 class="roll-history-title">Roll History</h3>
        <ol id="roll-history-list" class="roll-history-list"></ol>
      </section>
    </aside>
  </div>
  <script type="module" src="./index.ts"></script>
</body>
</html>
