<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dice Game</title>
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/die-mod-panel.css">
</head>
<body>
  <div class="app">
    <section class="panel play">
      <div class="play-mode-toggle" role="tablist" aria-label="Play mode">
        <button id="roll-mode-btn" class="mode-button" type="button">Roll</button>
        <button id="mod-mode-btn" class="mode-button" type="button">Mod</button>
        <button id="roll-3d-mode-btn" class="mode-button" type="button">Roll 3D</button>
      </div>
      <div id="roll-screen" class="play-screen">
        <canvas id="dice-canvas" width="900" height="520"></canvas>
        <button id="roll-btn" type="button">Roll</button>
      </div>
      <div id="die-mod-panel" class="die-mod-panel play-screen"></div>
      <div id="roll-3d-screen" class="play-screen is-hidden"></div>
    </section>

    <aside class="panel management">
      <div id="counter-grid" class="counter-grid"></div>
      <div id="score-panel" class="score-panel"></div>
      <ul id="trick-list" class="trick-list"></ul>
      <p>Placeholder for TB-03 bag management.</p>
      <section class="roll-history-panel" aria-label="Roll history">
        <h3 class="roll-history-title">Roll History</h3>
        <ol id="roll-history-list" class="roll-history-list"></ol>
      </section>
    </aside>
  </div>
  <script type="module" src="./index.ts"></script>
</body>
</html>
